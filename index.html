<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shein → Vinted Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">Shein → Vinted</div>
      <span class="tagline-header">Gestionnaire de liens produits</span>
    </div>
  </header>

  <main>
    <section class="input-section">
      <h2>Coller vos liens Shein</h2>
      <p class="hint">Un lien par ligne. Toutes les tailles seront listées automatiquement.</p>
      <textarea id="linksInput" placeholder="https://fr.shein.com/...&#10;https://fr.shein.com/...&#10;https://fr.shein.com/..."></textarea>
      <div class="btn-row">
        <button id="analyzeBtn" class="btn-primary">Analyser les liens</button>
        <button id="clearBtn" class="btn-secondary">Tout effacer</button>
      </div>
    </section>

    <section id="resultsSection" class="results-section hidden">
      <div class="results-header">
        <h2>Produits (<span id="productCount">0</span>)</h2>
        <div class="actions-row">
          <button id="exportBtn" class="btn-export">Exporter CSV</button>
          <button id="copyAllBtn" class="btn-export">Copier tous les liens</button>
        </div>
      </div>
      <div id="productGrid" class="product-grid"></div>
    </section>
  </main>

  <!-- Modal détail produit -->
  <div id="modal" class="modal hidden">
    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
