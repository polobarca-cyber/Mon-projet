<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shein → Vinted</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="logo">Shein → Vinted</div>
  </header>

  <main>
    <div class="card">
      <h2>Collez vos liens Shein</h2>
      <p class="hint">Un lien par ligne.</p>
      <textarea id="linksInput" placeholder="https://fr.shein.com/...&#10;https://fr.shein.com/..."></textarea>
      <div class="btn-row">
        <button id="generateBtn" class="btn-primary">Charger les articles</button>
        <button id="clearBtn" class="btn-secondary">Effacer</button>
      </div>
    </div>

    <div id="articlesSection" class="hidden">
      <div id="articlesList"></div>
      <div class="card final-card">
        <div class="btn-row">
          <button id="copyAllBtn" class="btn-primary">Tout copier</button>
          <button id="exportBtn" class="btn-dark">Exporter CSV</button>
        </div>
        <div id="copyPreview" class="copy-preview hidden"></div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
