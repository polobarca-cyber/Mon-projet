<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shein → Vinted</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SAISIE LIENS -->
  <div id="inputScreen" class="input-screen">
    <div class="input-box">
      <div class="input-logo">Shein → Vinted</div>
      <p class="input-sub">Collez vos liens Shein, un par ligne</p>
      <textarea id="linksInput" placeholder="https://fr.shein.com/...&#10;https://fr.shein.com/..."></textarea>
      <button id="generateBtn" class="btn-go">Charger les articles</button>
    </div>
  </div>

  <!-- ÉCRAN PRINCIPAL -->
  <div id="mainScreen" class="hidden">
    <header>
      <span class="logo">Shein → Vinted</span>
      <button id="backBtn" class="btn-back">+ Nouveaux liens</button>
    </header>

    <div class="cards-wrapper">
      <div id="cardsList"></div>

      <!-- ARTICLES ENREGISTRÉS -->
      <div id="savedSection" class="hidden">
        <div class="saved-section-title">
          <span>📋 Articles enregistrés</span>
          <button class="copy-btn" onclick="copyAllSaved()">Tout copier</button>
        </div>
        <div id="savedList"></div>
      </div>

      <!-- TOTAUX -->
      <div class="totals-bar">
        <div class="total-block">
          <span class="total-label">TOTAL ACHAT</span>
          <span class="total-val" id="totalAchat">0,00 €</span>
        </div>
        <div class="total-sep"></div>
        <div class="total-block">
          <span class="total-label">TOTAL REVENTE</span>
          <span class="total-val pink" id="totalRevente">0,00 €</span>
        </div>
        <div class="total-sep"></div>
        <div class="total-block">
          <span class="total-label">BÉNÉFICE</span>
          <span class="total-val green" id="totalBenef">0,00 €</span>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
